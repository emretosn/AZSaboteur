[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azsaboteur"
version = "0.1.0"
description = "Dynamic Azure Cloud Dynamic Attack Lab Generator — scenario-driven cloud security training"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "InquirerPy>=0.3.4",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
saboteur = "saboteur.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["saboteur"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
