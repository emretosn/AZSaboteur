- id: STR-PUBLIC-BLOB
  name: "Publicly Accessible Blob Container"
  category: storage
  description: "Enumerate and download blobs from a public container containing credentials or configs"
  requires:
    - network_access
  provides:
    - storage_key
  terraform_module: modules/public-blob
  ansible_role: roles/public-blob
  tags:
    - blob
    - public_access
    - entry_point

- id: STR-KEYVAULT-POLICY
  name: "Lax Key Vault Access Policy"
  category: storage
  description: "Use a compromised identity to list and retrieve secrets from a misconfigured Key Vault"
  requires:
    - managed_identity_token
  provides:
    - keyvault_secret
  terraform_module: modules/keyvault-lax-policy
  ansible_role: roles/keyvault-lax
  tags:
    - keyvault
    - access_policy

- id: STR-COSMOSDB-KEY
  name: "Cosmos DB Primary Key Leak"
  category: storage
  description: "Connect to Cosmos DB with a leaked master key and read all data"
  requires:
    - sql_credentials
  provides:
    - cosmosdb_data
  terraform_module: modules/cosmosdb-leaked-key
  ansible_role: roles/cosmosdb-key
  tags:
    - cosmosdb
    - connection_string

- id: STR-SAS-OVERPERM
  name: "Overly Permissive SAS Token"
  category: storage
  description: "Use a leaked SAS token with excessive permissions to read/write storage data"
  requires:
    - env_secrets
  provides:
    - storage_key
  terraform_module: modules/sas-overperm
  ansible_role: roles/sas-token
  tags:
    - sas
    - storage
