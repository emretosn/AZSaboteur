---
# --- Install dependencies ---
- name: Install nginx and git
  ansible.builtin.apt:
    name:
      - nginx
      - git
    state: present
    update_cache: true

# --- Deploy Flask app ---
- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Copy application files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ app_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - app.py
    - config.py
    - requirements.txt

- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    executable: pip3

- name: Write flag file
  ansible.builtin.copy:
    content: "{{ flag }}"
    dest: /opt/azsaboteur/flag.txt
    mode: "0600"

# --- Build fake git repo with secrets in history ---
- name: Create web root
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    mode: "0755"
    owner: www-data
    group: www-data

- name: Initialize git repository
  ansible.builtin.shell: |
    cd {{ web_root }}
    git init
    git config user.email "dev@initech-solutions.io"
    git config user.name "deploy-bot"
  args:
    creates: "{{ web_root }}/.git"

- name: Write config.py with secrets (first commit)
  ansible.builtin.template:
    src: config-with-secrets.py.j2
    dest: "{{ web_root }}/config.py"
    mode: "0644"

- name: Commit config with secrets
  ansible.builtin.shell: |
    cd {{ web_root }}
    git add config.py
    git commit -m "Initial commit — add application config"
  args:
    creates: "{{ web_root }}/.git/refs/heads/master"

- name: Overwrite config.py with cleaned version (second commit)
  ansible.builtin.copy:
    src: config.py
    dest: "{{ web_root }}/config.py"
    mode: "0644"

- name: Commit cleaned config
  ansible.builtin.shell: |
    cd {{ web_root }}
    git add config.py
    git commit -m "Remove hardcoded secrets — use key vault instead" || true

- name: Set web root ownership
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    recurse: true
    owner: www-data
    group: www-data

# --- Configure nginx ---
- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy nginx site config
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/sites-available/vuln-app.conf
    mode: "0644"

- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/vuln-app.conf
    dest: /etc/nginx/sites-enabled/vuln-app.conf
    state: link

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted
    enabled: true

# --- Start Flask app ---
- name: Deploy systemd service
  ansible.builtin.template:
    src: vuln-app.service.j2
    dest: /etc/systemd/system/vuln-app.service
    mode: "0644"

- name: Enable and start vulnerable app
  ansible.builtin.systemd:
    name: vuln-app
    state: started
    enabled: true
    daemon_reload: true
