---
- name: Ensure azsaboteur directory exists
  ansible.builtin.file:
    path: /opt/azsaboteur
    state: directory
    mode: "0755"
  become: true

# SSH banner and deployment portal are configured by Terraform cloud-init.
# The portal on port 8080 leaks SSH credentials in HTML source comments.
# Players: nmap → discover port 8080 → curl/browse → view source → SSH in.

- name: Plant next-step credentials breadcrumb
  ansible.builtin.copy:
    dest: "/home/{{ admin_username }}/.cloud-credentials"
    owner: "{{ admin_username }}"
    mode: "0600"
    content: |
      # Internal deployment credentials — auto-generated by ops pipeline
      # Server: {{ next_step_ip | default('10.13.37.x') }}
      SSH_USER={{ next_step_username | default('svc_deploy') }}
      SSH_PASS={{ next_step_password | default('changeme') }}
  become: true

- name: Create deployment notes with hints
  ansible.builtin.copy:
    dest: /opt/azsaboteur/notes.txt
    mode: "0644"
    content: |
      === Deployment Notes — Last updated by ops-team ===

      Environment: lab-rg-{{ step_index }}
      Status: provisioned

      This machine is a management gateway. Other VMs in the lab
      subnet (10.13.37.16/28) can be reached via SSH from here.

      Hint: {{ next_step_hint | default('Look for credentials and pivot to the next machine.') }}

      Do NOT leave credentials on this VM in production.
  become: true

- name: Write flag file
  ansible.builtin.copy:
    dest: /opt/azsaboteur/flag.txt
    mode: "0644"
    content: "{{ flag }}"
  become: true

- name: Plant realistic bash history
  ansible.builtin.copy:
    dest: "/home/{{ admin_username }}/.bash_history"
    owner: "{{ admin_username }}"
    mode: "0600"
    content: |
      cat ~/.cloud-credentials
      ssh {{ next_step_username | default('svc_deploy') }}@{{ next_step_ip | default('10.13.37.x') }}
      nmap -sV 10.13.37.16/28
      cat /opt/azsaboteur/notes.txt
      curl -s -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | python3 -m json.tool
      ls -la /opt/azsaboteur/
      cat /opt/azsaboteur/flag.txt
      history -c
  become: true
