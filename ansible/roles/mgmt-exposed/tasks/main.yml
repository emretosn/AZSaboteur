---
- name: Ensure azsaboteur directory exists
  ansible.builtin.file:
    path: /opt/azsaboteur
    state: directory
    mode: "0755"
  become: true

- name: Create SSH banner that leaks the service account username
  ansible.builtin.copy:
    dest: /etc/ssh/banner
    mode: "0644"
    content: |
      ************************************************************
        CONTOSO LABS - Deployment Gateway
        Authorized access only. All sessions are monitored.

        System account : {{ admin_username }}
        Support contact: {{ admin_username }}@contoso-labs.com
        Managed by     : ops-team@contoso-labs.com
      ************************************************************
  become: true

- name: Enable SSH banner in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Banner'
    line: 'Banner /etc/ssh/banner'
  become: true

- name: Raise MaxAuthTries to allow brute-force exercises
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries'
    line: 'MaxAuthTries 100'
  become: true

- name: Raise MaxStartups to handle parallel hydra connections
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxStartups'
    line: 'MaxStartups 100:30:200'
  become: true

- name: Set generous LoginGraceTime
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?LoginGraceTime'
    line: 'LoginGraceTime 120'
  become: true

- name: Disable fail2ban to prevent lockouts during brute-force
  ansible.builtin.systemd:
    name: fail2ban
    enabled: false
    state: stopped
  become: true
  ignore_errors: true

- name: Restart SSH to apply banner and connection settings
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  become: true

- name: Plant cloud credentials breadcrumb
  ansible.builtin.copy:
    dest: "/home/{{ admin_username }}/.cloud-credentials"
    owner: "{{ admin_username }}"
    mode: "0600"
    content: |
      # Azure Service Principal — auto-generated by deploy pipeline
      AZURE_CLIENT_ID=a1b2c3d4-e5f6-7890-abcd-ef1234567890
      AZURE_CLIENT_SECRET={{ next_step_secret }}
      AZURE_TENANT_ID=d4c3b2a1-f6e5-0987-dcba-0987654321fe
      AZURE_SUBSCRIPTION_ID=12345678-abcd-efab-cdef-1234567890ab
  become: true

- name: Create deployment notes with hints
  ansible.builtin.copy:
    dest: /opt/azsaboteur/notes.txt
    mode: "0644"
    content: |
      === Deployment Notes — Last updated by ops-team ===

      Environment: lab-rg-{{ step_index }}
      Status: provisioned

      Reminder: The service principal above has Contributor access
      to the resource group. Use it to manage Key Vault and storage
      resources if the portal is unavailable.

      Next task: {{ next_step_hint }}

      Do NOT leave credentials on this VM in production.
  become: true

- name: Write flag file
  ansible.builtin.copy:
    dest: /opt/azsaboteur/flag.txt
    mode: "0644"
    content: "{{ flag }}"
  become: true

- name: Plant realistic bash history
  ansible.builtin.copy:
    dest: "/home/{{ admin_username }}/.bash_history"
    owner: "{{ admin_username }}"
    mode: "0600"
    content: |
      az login --service-principal -u a1b2c3d4-e5f6-7890-abcd-ef1234567890 -p '********' --tenant d4c3b2a1-f6e5-0987-dcba-0987654321fe
      az account set --subscription 12345678-abcd-efab-cdef-1234567890ab
      az keyvault list --resource-group lab-rg
      az storage account list --resource-group lab-rg -o table
      cat /opt/azsaboteur/notes.txt
      curl -s -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | python3 -m json.tool
      az vm run-command invoke -g lab-rg -n lab-vm --command-id RunShellScript --scripts "whoami"
      cat ~/.cloud-credentials
      history -c
  become: true
